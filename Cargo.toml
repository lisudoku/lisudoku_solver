[package]
name = "lisudoku-solver"
version = "0.1.40"
authors = ["George Marcus <george.marcus922@gmail.com>"]
description = "Solver for sudoku variant puzzles used by lisudoku"
license-file = "LICENSE"
repository = "https://github.com/lisudoku/lisudoku_solver"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.scripts]
build = "wasm-pack build --target bundler"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
itertools = "0.15.0"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
derive_more = { version = "2.0.1", default-features = false, features = ["deref", "deref_mut"] }
enum_dispatch = "0.3.13"
strum = { version = "0.28", default-features = false, features = ["derive"] }
bit-set = { version = "0.11.1", default-features = false }
rand = "0.10.2"

# getrandom is a dependency of rand. Only enable the wasm feature for wasm build.
[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
insta = { version = "1.42.2", features = ["yaml"] }
ntest = "0.9.3"
url = "2"
serde_json = "1.0.93" # used by generate.rs for now; move behind feature later

[profile.profiling]
inherits = "release"
debug = true

[profile.release]
codegen-units = 1 # Slower build for better optimizations
